[project]
name = "malaria-agent"
version = "0.1.0"
description = "A small tool-using agent for malaria questions, used to test Praxiom AI"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["mypy>=1.11"]

[tool.mypy]
strict = true
