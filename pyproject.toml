[project]
name = "praxium"
version = "0.1.0"
description = "A desktop app for running a careful coding agent on your own projects"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.158.0",
    "openai>=3.36.0",
    "platformdirs>=4.13.5",
    "pywebview>=6.2.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
praxium = "praxium.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praxium"]

[tool.mypy]
strict = true
exclude = ["praxium/skills/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]
